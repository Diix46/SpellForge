name: Recompose image

# The image that makes the recomposed French cards on a schedule
# (scripts/recompose/auto.py). Rebuilt when the generator changes, or by hand.
# The print fonts are never in it: they are mounted where it runs.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recompose/**'
      - '.github/workflows/recompose-image.yml'
  workflow_dispatch:

concurrency:
  group: recompose-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: scripts/recompose
          push: true
          tags: |
            ghcr.io/diix46/spellforge-recompose:latest
            ghcr.io/diix46/spellforge-recompose:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Diix46/SpellForge
            org.opencontainers.image.description=Recomposed French Magic cards for SpellForge
          cache-from: type=gha,scope=recompose
          cache-to: type=gha,mode=max,scope=recompose
